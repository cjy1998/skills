<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书信息图 · 八种风格预览</title>
<style>
:root{--paper:#f6f5ef;--ink:#252b23;--accent:#daf58a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang SC",sans-serif}header{padding:28px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #daddd0}h1{font-size:22px;margin:0 0 6px}header p{font-size:13px;margin:0;opacity:.7}button{border:0;border-radius:24px;background:var(--button-bg,var(--ink));color:var(--accent);padding:14px 22px;font-size:15px;cursor:pointer}button:disabled{opacity:.6}.gallery{max-width:1560px;margin:28px auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding:0 24px 40px}figure{margin:0}canvas{display:block;width:100%;height:auto;box-shadow:0 12px 35px #252b2314}figcaption{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px}a{color:var(--ink);text-decoration:none}@media(max-width:950px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.gallery{grid-template-columns:1fr}header{padding:20px;align-items:flex-start}h1{font-size:18px}button{white-space:nowrap;padding:12px 16px;font-size:13px}}
</style>
</head>
<body>
<header><div><h1>小红书信息图</h1><p><span id="style-name">等待选择风格</span> · 1080 × 1440 px</p></div><button id="export">导出全部 PNG</button></header>
<main class="gallery" id="gallery"></main>
<script src="render.styles.js"></script>
<script src="render.js"></script>
</body>
</html>
